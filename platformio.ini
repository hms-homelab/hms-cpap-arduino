[env:cpapdash]
platform = espressif8266
board = esp8285
board_build.flash_mode = dio
board_build.ldscript = eagle.flash.2m128.ld
framework = arduino
monitor_speed = 115200
upload_speed = 460800
upload_port = /dev/ttyUSB1
build_flags =
    -Os
    -DWDT_YIELD_TIME_MILLIS=100
    -DAPP_VERSION="\"2026.1.1\""
lib_deps =
    tzapu/WiFiManager @ 2.0.17
    arduino-libraries/NTPClient
    paulstoffregen/Time
    bblanchon/ArduinoJson @ ^6
    https://github.com/earlephilhower/ESP8266SdFat/archive/refs/tags/2.2.2.tar.gz
